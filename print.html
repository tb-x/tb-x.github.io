<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tb-x Printables</title>
<meta name="description" content="Printable, wordless puzzles for young kids: make a sheet, print it, scan its QR code for the answer.">
<meta name="theme-color" content="#f3e7cf">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: a paper-coloured page with a home button, a short title for parents and a grid of big cards, one per
   printable maker (colour tile with an emoji on top, name and one line below). The whole card is the link. */
:root {
  --paper-top: #f3e7cf;
  --paper-bottom: #fbf6ec;
  --ink: #1f2a44;
  --ink-soft: #55627f;
  --card: #ffffff;
  --shadow: rgba(31, 42, 68, 0.2);
  --font-display: 'Fredoka', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --font-body: Verdana, Tahoma, 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper-top: #2a2418;
    --paper-bottom: #15120c;
    --ink: #f4efe4;
    --ink-soft: #c2b8a3;
    --card: #2f2a20;
    --shadow: rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper-top: #2a2418;
  --paper-bottom: #15120c;
  --ink: #f4efe4;
  --ink-soft: #c2b8a3;
  --card: #2f2a20;
  --shadow: rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--paper-bottom); }
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(180deg, var(--paper-top), var(--paper-bottom) 60%) no-repeat;
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
main {
  max-width: 1120px;
  margin: 0 auto;
  padding: calc(28px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
           calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}

#home {
  position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px)); z-index: 50;
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #2a2140;
  background: rgba(255, 255, 255, 0.82); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
  touch-action: manipulation; text-decoration: none;
}
#home svg { width: 24px; height: 24px; }
#home:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.18); }

header { text-align: center; margin-bottom: 28px; padding: 0 44px; }
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(38px, 8.5vw, 68px);
  line-height: 1;
  margin: 0;
  letter-spacing: 0.5px;
}
h1 span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
h1 span:nth-child(2) { animation-delay: 0.3s; }
.lead { margin: 12px auto 0; max-width: 36em; font-size: 16px; line-height: 1.5; color: var(--ink-soft); }
@keyframes bob { 50% { transform: translateY(-6px) rotate(-4deg); } }

.grid {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr));
  gap: 20px;
}
.card {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--card);
  border-radius: 26px;
  overflow: hidden;
  color: inherit;
  text-decoration: none;
  box-shadow: 0 6px 0 var(--shadow);
  touch-action: manipulation;
  transition: transform 0.12s, box-shadow 0.12s;
}
a.card:hover { transform: translateY(-3px); box-shadow: 0 9px 0 var(--shadow); }
a.card:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--shadow); }
a.card:focus-visible { outline: 4px solid var(--tone); outline-offset: 4px; }
.card[aria-disabled="true"] { cursor: default; }
.card[aria-disabled="true"] .tile { filter: saturate(0.35); opacity: 0.75; }

.tile {
  position: relative;
  aspect-ratio: 16 / 10;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.35), transparent 55%),
    var(--tone);
}
.emoji {
  font-size: clamp(64px, 16vw, 92px);
  line-height: 1;
  filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.18));
  transition: transform 0.2s;
}
a.card:hover .emoji { transform: scale(1.08) rotate(-6deg); }
.badge {
  position: absolute;
  top: 12px;
  right: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  color: #1f2a44;
  font: 600 14px/1.2 var(--font-display);
  letter-spacing: 0.04em;
}
.badge.soon { left: 12px; right: auto; background: #1f2a44; color: #fff; }

.text { padding: 16px 20px 20px; display: grid; gap: 6px; }
.text h2 { margin: 0; font: 700 25px/1.1 var(--font-display); }
.text p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--ink-soft); }

@media (prefers-reduced-motion: reduce) {
  h1 span { animation: none; }
  .card, .emoji { transition: none; }
}
</style>
</head>
<body>
<a id="home" href="index.html" aria-label="All games" title="All games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9.8V20h12V9.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 20v-5.5h4V20" fill="currentColor"/></svg></a>

<main>
  <header>
    <h1><span>Print</span> <span>&amp; play</span></h1>
    <p class="lead">Puzzle sheets to make at home for kids around five. Pick the settings, print on A4 in black and white, and scan the QR code on the sheet to see the answer. No words on the sheets, so they work before reading does.</p>
  </header>
  <ul class="grid" id="makers"></ul>
</main>

<script>
// One entry per printable maker. dir: the folder next to this page. repo: the GitHub repo under github.com/tb-x
// (null until it is published).
const MAKERS = [
  { dir: 'treasure-map', repo: 'treasure-map',   emoji: '🗺️', tone: '#2b6f8f',
    name: 'Treasure Map',     blurb: 'A treasure hunt on a grid: solve the sum on each arrow card and move that many squares to find the chest.' },
  { dir: 'sudoku',       repo: 'picture-sudoku', emoji: '🧩', tone: '#5b47b0',
    name: 'Picture Sudoku',   blurb: 'Small sudokus with pictures instead of numbers, and pieces to cut out and glue in.' },
  { dir: 'maze',         repo: 'maze-maker',     emoji: '🐭', tone: '#2a7f62',
    name: 'Maze Maker',       blurb: 'Mazes from tiny to enormous: get the mouse to its cheese, picking up stars on the way.' },
  { dir: 'what-next',    repo: 'what-comes-next', emoji: '🔷', tone: '#d9622b',
    name: 'What Comes Next?', blurb: 'Rows of picture patterns that repeat, turn or count. Fill in the grey squares.' },
];

// On GitHub Pages each maker is its own repo (tb-x.github.io/<repo>/); everywhere else they sit in folders next to this page.
const onPages = location.hostname.endsWith('github.io');
const list = document.getElementById('makers');

for (const m of MAKERS) {
  const live = !onPages || m.repo;
  const card = document.createElement(live ? 'a' : 'div');
  card.className = 'card';
  card.style.setProperty('--tone', m.tone);
  if (live) card.href = onPages ? `/${m.repo}/` : `${m.dir}/index.html`;
  else card.setAttribute('aria-disabled', 'true');

  card.innerHTML = `
    <div class="tile">
      <span class="emoji" aria-hidden="true">${m.emoji}</span>
      <span class="badge" title="Prints on A4">A4</span>
      ${live ? '' : '<span class="badge soon">Coming soon</span>'}
    </div>
    <div class="text">
      <h2>${m.name}</h2>
      <p>${m.blurb}</p>
    </div>`;

  const li = document.createElement('li');
  li.append(card);
  list.append(li);
}
</script>
<script>
// Offline support: the site's sw.js caches this page too. Once the page has loaded, send it every file the page
// used (fonts) so those work offline as well. Fails quietly where unsupported, e.g. on file://.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then((reg) => {
    const send = () => reg.active && reg.active.postMessage({ cache: [location.href, ...performance.getEntriesByType('resource').map((r) => r.name)] });
    send(); setTimeout(send, 5000); setTimeout(send, 20000);
  }).catch(() => {});
}
</script>
</body>
</html>
